<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>LyricSnap</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0f0d2e;
      overflow: hidden;
    }
    #frame {
      display: block;
      border: 0;
      width: 100%;
      height: 100vh;
    }
    #offline {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #f1f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <iframe
    id="frame"
    src="https://kuro-83.github.io/lyricsnap/"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer"></iframe>
  <div id="offline">
    LyricSnap を読み込めませんでした。<br>
    ネットワーク接続を確認して、パネルを開き直してください。
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
